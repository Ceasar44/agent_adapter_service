[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-adapter-service"
version = "0.1.0"
description = "FastAPI service for adapting agent requests to backend providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "ag-ui-protocol==0.1.22",
    "anyio>=4.0,<5.0",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
]

[project.optional-dependencies]
integrations = [
    "parlant==3.3.2",
    "fastmcp==4.0.3",
]
dev = [
    "graphql-core>=3.2,<3.3",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
    "ariadne-codegen>=0.14,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_adapter_service*"]

[tool.ariadne-codegen]
schema_path = "schema.graphql"
queries_path = "src/agent_adapter_service/saleor/graphql"
target_package_name = "saleor_client"
target_package_path = "src/agent_adapter_service/saleor"
convert_to_snake_case = false
